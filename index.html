<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMAR PARFUM | Семей</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b1710; color: #ffffff; padding-bottom: 80px; }
        
        header { background: #11261a; padding: 25px 20px; text-align: center; border-bottom: 2px solid #d4af37; }
        .logo { font-size: 30px; font-weight: 800; color: #d4af37; letter-spacing: 2px; }
        .sublogo { font-size: 14px; color: #a3c1ad; margin-top: 6px; }

        .banner { background: #132e20; padding: 20px; text-align: center; border-bottom: 1px solid #224d35; margin-bottom: 15px; }
        .banner h2 { font-size: 20px; color: #fff; margin-bottom: 6px; }
        .banner p { font-size: 14px; color: #b7e4c7; }

        .search-box { padding: 0 15px 15px; }
        .search-box input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid #d4af37; background: #132e20; color: #fff; font-size: 16px; outline: none; }

        .main-menu { display: flex; flex-direction: column; gap: 12px; padding: 10px 15px; }
        .menu-btn { background: #132e20; border: 2px solid #224d35; border-radius: 16px; padding: 20px; text-align: left; color: #fff; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .menu-btn.active { border-color: #d4af37; background: #1a3e2b; }
        .menu-btn h3 { font-size: 20px; color: #d4af37; }
        .menu-btn p { font-size: 13px; color: #a3c1ad; margin-top: 4px; }

        .catalog-section { display: none; padding: 15px; }
        .catalog-section.active { display: block; }

        .product-card { background: #132e20; border: 1px solid #224d35; border-radius: 16px; padding: 18px; margin-bottom: 14px; }
        .product-title { font-size: 20px; font-weight: bold; color: #ffffff; margin-bottom: 8px; }
        .product-desc { font-size: 13px; color: #a3c1ad; margin-bottom: 15px; }

        .price-tag { font-size: 22px; font-weight: bold; color: #d4af37; margin-bottom: 12px; }
        .order-btn { display: block; width: 100%; background: #25d366; color: #fff; text-align: center; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; text-decoration: none; }

        .footer-info { position: fixed; bottom: 0; left: 0; right: 0; background: #11261a; border-top: 2px solid #d4af37; padding: 15px; text-align: center; font-size: 14px; color: #b7e4c7; }
    </style>
</head>
<body>

    <header>
        <div class="logo">UMAR PARFUM</div>
        <div class="sublogo">Семей, ул. Дулатова 266</div>
    </header>

    <div class="banner">
        <h2>Стойкость аромата до 7 дней</h2>
        <p>Доставка по Семею и всему Казахстану</p>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Найти аромат (например: Bvlgari, Creed)..." oninput="searchParfume()">
    </div>

    <!-- Крупные удобные категории -->
    <div class="main-menu" id="menuBlocks">
        <div class="menu-btn" onclick="showCategory('men')">
            <div>
                <h3>Мужские ароматы 🐺</h3>
                <p>Крутая классика и селективная ниша</p>
            </div>
            <span style="font-size: 24px; color: #d4af37;">➔</span>
        </div>
        <div class="menu-btn" onclick="showCategory('women')">
            <div>
                <h3>Женские ароматы 🌸</h3>
                <p>Нежные, шлейфовые и яркие парфюмы</p>
            </div>
            <span style="font-size: 24px; color: #d4af37;">➔</span>
        </div>
    </div>

    <!-- Раздел с товарами -->
    <div class="catalog-section" id="catalogArea">
        <button onclick="backToMenu()" style="background: #224d35; color: #fff; border: none; padding: 10px 18px; border-radius: 10px; margin-bottom: 15px; font-size: 15px; cursor: pointer;">⬅ Назад к категориям</button>
        <div id="productList"></div>
    </div>

    <div class="footer-info">
        📍 Доставка по Казахстану • Заказ в 1 клик
    </div>

    <script>
        const perfumes = [
            // Мужские
            { name: "Versace Man Eau Fraiche", cat: "men", p10: "6 500 ₸", p30: "15 000 ₸" },
            { name: "Creed Viking", cat: "men", p10: "7 500 ₸", p30: "20 000 ₸" },
            { name: "Mango Skin Vilhelm Parfumerie", cat: "men", p10: "7 500 ₸", p30: "19 000 ₸" },
            { name: "Chanel Allure Homme Sport", cat: "men", p10: "7 000 ₸", p30: "16 000 ₸" },
            { name: "Tom Ford Noir Extreme", cat: "men", p10: "7 500 ₸", p30: "20 000 ₸" },
            { name: "JPG Le Beau Paradise Garden", cat: "men", p10: "7 500 ₸", p30: "19 000 ₸" },
            { name: "Amouage Purpose 50", cat: "men", p10: "7 500 ₸", p30: "20 000 ₸" },
            { name: "Kazakh Borz", cat: "men", p10: "7 500 ₸", p30: "20 000 ₸" },
            { name: "Khamrah Lattafa", cat: "men", p10: "6 500 ₸", p30: "15 000 ₸" },
            { name: "Initio Side Effect", cat: "men", p10: "7 500 ₸", p30: "20 000 ₸" },
            { name: "Versace Dylan Blue", cat: "men", p10: "6 800 ₸", p30: "16 000 ₸" },
            { name: "Dior Fahrenheit", cat: "men", p10: "7 000 ₸", p30: "16 500 ₸" },
            { name: "Roja Oligarch", cat: "men", p10: "7 500 ₸", p30: "20 000 ₸" },
            { name: "Santal 33 Le Labo", cat: "men", p10: "7 500 ₸", p30: "20 000 ₸" },
            { name: "Bleu de Chanel", cat: "men", p10: "7 000 ₸", p30: "17 000 ₸" },
            { name: "Dior Sauvage", cat: "men", p10: "7 000 ₸", p30: "17 000 ₸" },
            { name: "Fleur Narcotique Ex Nihilo", cat: "men", p10: "7 500 ₸", p30: "20 000 ₸" },
            { name: "Bvlgari Tygar", cat: "men", p10: "7 500 ₸", p30: "20 000 ₸" },
            { name: "Creed Aventus", cat: "men", p10: "7 500 ₸", p30: "20 000 ₸" },
            { name: "Ex Nihilo Blue Talisman", cat: "men", p10: "7 500 ₸", p30: "20 000 ₸" },
            { name: "Louis Vuitton Imagination", cat: "men", p10: "7 500 ₸", p30: "20 000 ₸" },
            { name: "Orto Parisi Megamare", cat: "men", p10: "7 500 ₸", p30: "20 000 ₸" },

            // Женские
            { name: "J'adore Dior", cat: "women", p10: "7 000 ₸", p30: "16 500 ₸" },
            { name: "Lancome Idole", cat: "women", p10: "7 000 ₸", p30: "16 500 ₸" },
            { name: "Chanel Chance Eau Tendre", cat: "women", p10: "7 000 ₸", p30: "17 000 ₸" },
            { name: "Tom Ford Black Orchid", cat: "women", p10: "7 500 ₸", p30: "20 000 ₸" },
            { name: "YSL Libre", cat: "women", p10: "7 000 ₸", p30: "17 000 ₸" },
            { name: "Amouage Guidance", cat: "women", p10: "7 500 ₸", p30: "20 000 ₸" },
            { name: "Versace Bright Crystal", cat: "women", p10: "6 500 ₸", p30: "15 000 ₸" },
            { name: "Tom Ford Tobacco Vanille", cat: "women", p10: "7 500 ₸", p30: "20 000 ₸" },
            { name: "Kilian Angels' Share", cat: "women", p10: "7 500 ₸", p30: "20 000 ₸" },
            { name: "Attrape-Reves Louis Vuitton", cat: "women", p10: "7 500 ₸", p30: "20 000 ₸" },
            { name: "Victoria's Secret Bombshell", cat: "women", p10: "6 500 ₸", p30: "14 000 ₸" },
            { name: "Byredo Blanche", cat: "women", p10: "7 500 ₸", p30: "20 000 ₸" },
            { name: "YSL Black Opium", cat: "women", p10: "7 000 ₸", p30: "17 000 ₸" },
            { name: "Parfums de Marly Delina", cat: "women", p10: "7 500 ₸", p30: "20 000 ₸" },
            { name: "Tom Ford Lost Cherry", cat: "women", p10: "7 500 ₸", p30: "20 000 ₸" },
            { name: "Attar Collection Hayati", cat: "women", p10: "7 000 ₸", p30: "18 000 ₸" }
        ];

        function showCategory(category) {
            document.getElementById('menuBlocks').style.display = 'none';
            document.getElementById('catalogArea').classList.add('active');
            
            const list = document.getElementById('productList');
            list.innerHTML = '';

            const filtered = perfumes.filter(p => p.cat === category);
            filtered.forEach(item => {
                const waText = encodeURIComponent(`Здравствуйте! Хочу заказать: ${item.name}`);
                list.innerHTML += `
                    <div class="product-card">
                        <div class="product-title">${item.name}</div>
                        <div class="product-desc">10 мл: <b>${item.p10}</b> | 30 мл: <b>${item.p30}</b></div>
                        <a href="https://wa.me/77789552591?text=${waText}" target="_blank" class="order-btn">Заказать в WhatsApp</a>
                    </div>
                `;
            });
        }

        function backToMenu() {
            document.getElementById('menuBlocks').style.display = 'flex';
            document.getElementById('catalogArea').classList.remove('active');
            document.getElementById('searchInput').value = '';
        }

        function searchParfume() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (query.trim() === '') {
                backToMenu();
                return;
            }

            document.getElementById('menuBlocks').style.display = 'none';
            document.getElementById('catalogArea').classList.add('active');
            
            const list = document.getElementById('productList');
            list.innerHTML = '';

            const filtered = perfumes.filter(p => p.name.toLowerCase().includes(query));
            if(filtered.length === 0) {
                list.innerHTML = '<p style="text-align:center; padding: 20px; color: #a3c1ad;">Аромат не найден</p>';
                return;
            }

            filtered.forEach(item => {
                const waText = encodeURIComponent(`Здравствуйте! Хочу заказать: ${item.name}`);
                list.innerHTML += `
                    <div class="product-card">
                        <div class="product-title">${item.name}</div>
                        <div class="product-desc">10 мл: <b>${item.p10}</b> | 30 мл: <b>${item.p30}</b></div>
                        <a href="https://wa.me/77789552591?text=${waText}" target="_blank" class="order-btn">Заказать в WhatsApp</a>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
